  - { path: packages/infrastructure/src/workspace-revision, status: done, ref: C2 }
  - { path: packages/infrastructure/src/path, status: done, ref: C3 }
  - { path: packages/testing/src/fake-model, status: done, ref: C9 }
  - { path: packages/testing/src/adversarial, status: done, ref: C8 }
