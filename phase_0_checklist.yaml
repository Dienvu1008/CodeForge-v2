# phase_0_checklist.yaml (A5) — CI-executable Phase 0 acceptance checklist.
# PHASE_0_ACCEPTANCE §10. Paths are relative to the workspace root (no docs/ dir in v1).
#
# `check` describes how CI verifies the item. `status` is the current known state
# (done | pending). CI should assert every `done` item stays true.

version: 1.1
platform:
  supported: [windows, linux-wsl2]
  ci_runners: [windows-latest, ubuntu-latest]
  macos: deferred-v2

files:
  docs:
    - { path: INVARIANTS.md, status: done }
    - { path: WORKSPACE_SPEC.md, status: done }
    - { path: DOMAIN_CONTRACTS.md, status: done }
    - { path: STATE_MACHINE_SPEC.md, status: done }
    - { path: GRAPH_PROTOCOL.md, status: done }
    - { path: VERIFICATION_PROTOCOL.md, status: done }
    - { path: SECURITY_MODEL.md, status: done }
    - { path: MIGRATION_SPEC.md, status: done }
    - { path: EVALUATION_MODEL.md, status: done }
    - { path: CONTEXT_SPEC.md, status: done }
    - { path: INFRASTRUCTURE_SPEC.md, status: done }
    - { path: PLATFORM_SUPPORT.md, status: done }
    - { path: ARCHITECTURE_DIAGRAMS.md, status: done }
    - { path: PHASE_0_ACCEPTANCE.md, status: done }
    - { path: PHASE_0_ROADMAP.md, status: done }
  machine_readable:
    - { path: invariants.yaml, status: done, check: "js-yaml parse + schema" }
    - { path: invariants.schema.json, status: done }
    - { path: scenarios.yaml, status: done }
    - { path: phase_0_checklist.yaml, status: done }

