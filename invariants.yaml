# invariants.yaml
# Machine-readable appendix of INVARIANTS.md (single source of truth = INVARIANTS.md).
# CI dùng file này để: (1) fail nếu invariant CRITICAL ACTIVE thiếu test file;
# (2) fail nếu test file tồn tại nhưng không pass; (3) fail nếu invariant bị xóa mà
# không DEPRECATED kèm reason.
#
# Nếu file này lệch INVARIANTS.md, INVARIANTS.md là chuẩn.
# Quy ước test path: tests/invariants/<domain>/<id-lowercased>.spec.ts

version: 1.1
invariants:

  # ── Session (SS) ────────────────────────────────────────────────
  - id: SS-001
    statement: "Một workspace chỉ có tối đa một active session."
    enforcement: ["WorkspaceLock"]
    violation_class: SESSION_LOCKED
    test: "tests/invariants/session/ss-001.spec.ts"
    phase: 1
    severity: CRITICAL
    status: ACTIVE
  - id: SS-002
    statement: "Session lifecycle chỉ đi theo transition hợp lệ."
    enforcement: ["SessionStateMachine"]
    violation_class: INVALID_TRANSITION
