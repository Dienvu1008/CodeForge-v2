    enforcement: ["SessionFinalizer"]
    violation_class: PREMATURE_COMPLETION
    test: "tests/invariants/session/ss-003.spec.ts"
    phase: 1
    severity: CRITICAL
    status: ACTIVE
  - id: SS-004
    statement: "Cancellation của session phải propagate tới mọi TaskRun đang chạy (từ cả RUNNING và AWAITING_HUMAN)."
    enforcement: ["SessionCoordinator"]
    violation_class: ORPHAN_TASKRUN
    test: "tests/invariants/session/ss-004.spec.ts"
    phase: 1
    severity: CRITICAL
    status: ACTIVE
  - id: SS-005
