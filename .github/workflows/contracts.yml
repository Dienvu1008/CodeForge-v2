name: contracts

on:
  push:
    branches: [main]
  pull_request:

# CI4: contract / type-conformance tests (DT/SM/GR/RI) + machine-readable artifacts.
# Ubuntu only — conformance is platform-independent.
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:contracts
