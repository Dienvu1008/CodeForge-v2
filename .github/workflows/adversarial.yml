name: adversarial

on:
  push:
    branches: [main]
  pull_request:

# CI3: adversarial harness — 7 variants + scenarios. Ubuntu only (deterministic, no OS-specific paths).
jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:adversarial
